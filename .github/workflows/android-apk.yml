name: Build and smoke-test ZeroToUsers APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and validate Android source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d android-source.tar.gz.b64 > /tmp/zerotousers-source.tar.gz
          gzip -t /tmp/zerotousers-source.tar.gz
          tar -tzf /tmp/zerotousers-source.tar.gz > /tmp/source-file-list.txt
          echo "Archive entries:"
          cat /tmp/source-file-list.txt
          tar -xzf /tmp/zerotousers-source.tar.gz -C .
          test -s app/src/main/AndroidManifest.xml
          test -s app/build.gradle
          echo "Source archive restored successfully."

      - name: Upload extracted Android source for review
        uses: actions/upload-artifact@v4
        with:
          name: ZeroToUsers-v0.3.0-android-source
          path: app/src/main/
          if-no-files-found: error
          retention-days: 7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK package, dex and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.zerotousers.growth'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          with ZipFile(apk) as z:
              names = set(z.namelist())
              assert "AndroidManifest.xml" in names
              assert "classes.dex" in names
              assert "resources.arsc" in names
              dex_bytes = sum(info.file_size for info in z.infolist() if info.filename.endswith(".dex"))
              assert dex_bytes > 30000, f"DEX payload unexpectedly small: {dex_bytes}"
          print(f"APK size: {apk.stat().st_size:,} bytes; DEX payload: {dex_bytes:,} bytes")
          PY

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Launch app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-boot-timeout: 600
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.zerotousers.growth/.MainActivity
            sleep 3
            adb shell pidof com.zerotousers.growth
            adb exec-out screencap -p > zerotousers-home-smoke.png
            test -s zerotousers-home-smoke.png
            adb shell wm size
            adb shell wm density
            adb shell uiautomator dump /sdcard/window.xml
            adb shell cat /sdcard/window.xml
            adb shell input tap 540 1010
            sleep 2
            adb shell uiautomator dump /sdcard/window-after.xml
            adb shell cat /sdcard/window-after.xml | grep -F 'Create a workspace'
            adb exec-out screencap -p > zerotousers-workspace-create.png
            test -s zerotousers-workspace-create.png
            adb shell input tap 540 870
            adb shell input text 'Test%sBusiness'
            sleep 1
            adb exec-out screencap -p > zerotousers-workspace-name-entered.png
            test -s zerotousers-workspace-name-entered.png
            adb shell input keyevent 4
            sleep 1
            adb shell uiautomator dump /sdcard/window-ready-to-create.xml
            adb shell cat /sdcard/window-ready-to-create.xml
            adb shell input tap 880 1150
            sleep 2
            adb shell uiautomator dump /sdcard/window-saved.xml
            adb shell cat /sdcard/window-saved.xml
            adb exec-out screencap -p > zerotousers-workspace-saved.png
            test -s zerotousers-workspace-saved.png

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroToUsers-v0.3.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ZeroToUsers-v0.3.0-emulator-screenshot
          path: zerotousers-home-smoke.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload workspace-create interaction screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ZeroToUsers-v0.3.0-workspace-create-screen
          path: zerotousers-workspace-create.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload saved workspace screen
        uses: actions/upload-artifact@v4
        with:
          name: ZeroToUsers-v0.3.0-workspace-saved-screen
          path: zerotousers-workspace-saved.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload typed workspace-name screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ZeroToUsers-v0.3.0-workspace-name-entered
          path: zerotousers-workspace-name-entered.png
          if-no-files-found: error
          retention-days: 7
